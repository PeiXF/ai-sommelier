/**
 * Browser-only recommendation engine, reconstructed from the public demo.
 * It uses a weighted rule system and does not call an AI service.
 */
const ADJACENT_TASTES = {
  "light-fresh": ["fruity-easy"],
  "fruity-easy": ["light-fresh", "smooth-round", "sweet"],
  "smooth-round": ["fruity-easy", "rich-bold"],
  "rich-bold": ["smooth-round"],
  sweet: ["fruity-easy"],
};

function winePrice(wine, answers) {
  return answers.serving === "glass"
    ? wine.glassPrice ?? wine.bottlePrice
    : wine.bottlePrice;
}

const BUDGET_LIMITS = {
  glass: { low: 6, mid: 9 },
  bottle: { low: 30, mid: 50 },
};

function budgetScore(price, answers) {
  const { low, mid: middle } = BUDGET_LIMITS[answers.serving === "glass" ? "glass" : "bottle"];
  if (!answers.budget || answers.budget === "any") {
    return { points: 20, strict: true };
  }
  if (answers.budget === "high") {
    return { points: price >= middle ? 20 : 12, strict: true };
  }
  const ceiling = answers.budget === "low" ? low : middle;
  if (price <= ceiling) {
    return {
      points: answers.budget === "mid" && price <= low ? 12 : 20,
      strict: true,
    };
  }
  // The original allows a 15% margin before marking a wine over budget.
  if (Math.round(price * 100) <= Math.round(ceiling * 115)) {
    return { points: 10, strict: true, note: "slightlyAbove" };
  }
  return { points: 0, strict: false, note: "aboveBudget" };
}

function recommendWines(answers, wines) {
  const available = wines.filter(
    (wine) => wine.available &&
      (answers.serving !== "glass" || wine.glassPrice !== null),
  );
  const target = answers.serving === "glass"
    ? { low: 4.5, mid: 7.5, high: 11, any: 0 }
    : { low: 25, mid: 40, high: 65, any: 0 };

  function scoreAll(ignoreColour = false, boostAdjacent = false) {
    return available.map((wine) => {
      const reasons = [];
      let taste = 0;
      if (answers.taste === "surprise") {
        taste = 20;
        reasons.push("surprise");
      } else if (answers.taste && wine.tasteProfiles.includes(answers.taste)) {
        taste = 40;
        reasons.push(answers.taste);
      } else if (answers.taste && wine.tasteProfiles.some(
        (profile) => ADJACENT_TASTES[answers.taste]?.includes(profile),
      )) {
        taste = boostAdjacent ? 40 : 20;
        reasons.push("adjacent");
      }
      const food = answers.foods.some((item) => wine.foodPairings.includes(item)) ? 25 : 0;
      if (food) reasons.push("food");
      const budget = budgetScore(winePrice(wine, answers), answers);
      reasons.push("budget");
      const colour = ignoreColour || !answers.colourPref
        ? 5 : wine.colour === answers.colourPref ? 10 : 0;
      const house = wine.isHouseFavourite ? (answers.taste === "surprise" ? 10 : 5) : 0;
      if (house) reasons.push("house");
      const maximum = answers.foods.length ? 100 : 75;
      return {
        wine,
        score: Math.min(100, Math.round((taste + food + budget.points + colour + house) / maximum * 100)),
        reasons,
        priceNote: budget.note,
        rank: "alt",
      };
    });
  }

  function sort(items, preferCheap = false) {
    return items.sort((left, right) =>
      right.score - left.score ||
      (preferCheap
        ? winePrice(left.wine, answers) - winePrice(right.wine, answers)
        : answers.budget && answers.budget !== "any"
          ? Math.abs(winePrice(left.wine, answers) - target[answers.budget]) -
            Math.abs(winePrice(right.wine, answers) - target[answers.budget])
          : 0) ||
      left.wine.id.localeCompare(right.wine.id),
    );
  }

  let scored = scoreAll();
  let selected = sort(scored.filter((item) => item.priceNote !== "aboveBudget"));
  let budgetFallback = selected.length < 3 && scored.some((item) => item.priceNote === "aboveBudget");
  if (selected.length < 3) {
    selected.push(...sort(scored.filter((item) => item.priceNote === "aboveBudget"), true)
      .slice(0, 3 - selected.length));
  }

  let relaxed = false;
  if (selected.length < 3 || (selected[0]?.score ?? 0) < 45) {
    relaxed = true;
    scored = scoreAll(true);
    selected = sort(scored.filter((item) => item.priceNote !== "aboveBudget"));
    if ((selected[0]?.score ?? 0) < 45) {
      scored = scoreAll(true, true);
      selected = sort(scored.filter((item) => item.priceNote !== "aboveBudget"));
    }
    if (selected.length < 3) {
      const overBudget = sort(scored.filter((item) => item.priceNote === "aboveBudget"), true);
      budgetFallback ||= overBudget.length > 0;
      selected.push(...overBudget.slice(0, 3 - selected.length));
    }
  }

  let results = selected.slice(0, 3);
  const [first, second, third] = results;
  // Add colour variety only when a similarly scoring alternative exists.
  if (first && second && third && results.every((item) => item.wine.colour === first.wine.colour)) {
    const different = sort(scored.filter((item) =>
      item.wine.colour !== first.wine.colour &&
      item.score >= third.score - 10 &&
      !results.some((result) => result.wine.id === item.wine.id) &&
      (budgetFallback || item.priceNote !== "aboveBudget"),
    ))[0];
    if (different) results = [first, second, different];
  }
  return {
    results: results.map((item, index) => ({ ...item, rank: index === 0 ? "best" : "alt" })),
    meta: { noExactMatch: budgetFallback || relaxed, budgetOnly: budgetFallback && !relaxed },
  };
}

function formatPrice(value, language) {
  return new Intl.NumberFormat(language === "de" ? "de-DE" : "en-IE", {
    style: "currency", currency: "EUR",
  }).format(value);
}

function interpolate(template, values) {
  return template.replace(/\{(\w+)\}/g, (_, key) => values[key] ?? "");
}

/* Readable, dependency-free reconstruction of the published React interface. */
"use strict";

const SCREENS = ["welcome", "language", "taste", "food", "serving", "budget", "results"];
const TASTES = ["light-fresh", "fruity-easy", "smooth-round", "rich-bold", "sweet", "surprise"];
const COLOURS = ["red", "white", "rose", "sparkling"];
const FOODS = ["fish", "poultry", "red-meat", "vegetarian", "pasta-pizza", "cheese", "dessert"];
const BUDGETS = ["low", "mid", "high", "any"];
const TASTE_ICONS = ["droplets", "grape", "heart", "sun", "sparkles", "wine"];
const SESSION_KEY = "ai-sommelier-session";
const FEEDBACK_KEY = "ai-sommelier-feedback";
const root = document.getElementById("app");
let state = restoreSession();
let legalModal = null;
let modalTrigger = null;
let showFoodLimit = false;
let feedback = null;
let lastAdvance = 0;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[character]);
}

function icon(name, className = "", size = 24) {
  const nodes = ICONS[name] || ICONS.wine;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"
    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" class="${escapeHTML(className)}" aria-hidden="true">
    ${nodes.map(([tag, attributes]) => `<${tag} ${Object.entries(attributes)
      .map(([key, value]) => `${key}="${escapeHTML(value)}"`).join(" ")}></${tag}>`).join("")}
    </svg>`;
}

function button(content, action, value = "", className = "ghost", options = {}) {
  const { pressed, label, disabled = false, focusKey = `${action}:${value}` } = options;
  return `<button type="button" class="${className}" data-action="${action}"
    data-value="${escapeHTML(value)}" data-focus="${escapeHTML(focusKey)}"
    ${pressed === undefined ? "" : `aria-pressed="${pressed}"`}
    ${label ? `aria-label="${escapeHTML(label)}"` : ""} ${disabled ? "disabled" : ""}>${content}</button>`;
}

function freshSession(language) {
  return { screen: "welcome", answers: { language, foods: [], colourPref: null } };
}

function validAnswers(answers) {
  return !!answers &&
    ["en", "de"].includes(answers.language) &&
    Array.isArray(answers.foods) && answers.foods.length <= 2 &&
    answers.foods.every((food) => FOODS.includes(food)) &&
    (!answers.taste || TASTES.includes(answers.taste)) &&
    (!answers.serving || ["glass", "bottle"].includes(answers.serving)) &&
    (!answers.budget || BUDGETS.includes(answers.budget)) &&
    (!answers.colourPref || COLOURS.includes(answers.colourPref));
}

function validSession(value) {
  return validAnswers(value?.answers) && SCREENS.includes(value.screen) &&
    (!value.beforeEdit || (["taste", "food", "serving", "budget"].includes(value.screen) &&
      validAnswers(value.beforeEdit)));
}

function restoreSession() {
  try {
    const stored = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    if (validSession(stored)) return stored;
  } catch { /* A denied or corrupt store must not prevent using the page. */ }
  return freshSession(navigator.language.toLowerCase().startsWith("de") ? "de" : "en");
}

function saveSession() {
  document.documentElement.lang = state.answers.language;
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(state)); } catch { /* Optional. */ }
}

function readFeedback() {
  try {
    const saved = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch { return []; }
}

function updateAnswers(patch = {}, nextScreen = state.screen, advancing = false, beforeEdit = state.beforeEdit) {
  if (advancing && Date.now() - lastAdvance < 300) return;
  if (advancing) lastAdvance = Date.now();
  const screenChanged = state.screen !== nextScreen;
  state = { screen: nextScreen, answers: { ...state.answers, ...patch } };
  if (beforeEdit && nextScreen !== "results") state.beforeEdit = beforeEdit;
  if (screenChanged) showFoodLimit = false;
  saveSession();
  render(screenChanged);
}

function choice(title, subtitle, name, action, value, selected) {
  return button(`<span class="choice-icon">${icon(name)}</span>
    <span><strong>${escapeHTML(title)}</strong>${subtitle ? `<small>${escapeHTML(subtitle)}</small>` : ""}</span>
    ${icon("chevron-right", "choice-chevron")}`, action, value, "choice-button", { pressed: selected });
}

function restaurantLine(t, extraClass = "") {
  return `<div class="restaurant-line ${extraClass}"><span>${t.restaurant}</span><span class="demo-tag">${t.demo}</span></div>`;
}

function welcome(t) {
  return `<main class="welcome screen-enter">
    ${restaurantLine(t)}
    <div class="wine-illustration" aria-hidden="true">${icon("wine")}${icon("leaf", "illustration-leaf")}${icon("sparkles", "illustration-spark")}</div>
    <h1>${escapeHTML(t.welcomeTitle)}</h1><p class="welcome-copy">${t.welcome}</p>
    <div class="welcome-actions">${button(`${t.start}${icon("arrow-right")}`, "start", "", "sommelier-button")}
    <p class="responsible">${t.responsible}</p></div>
    </main>`;
}

function questionnaire(t) {
  const a = state.answers;
  const screen = state.screen;
  const titles = { language: t.chooseLanguage, taste: t.tasteTitle, food: t.foodTitle,
    serving: t.servingTitle, budget: t.budgetTitle, results: t.results };
  const hints = { taste: t.tasteHint, food: t.foodHint, serving: t.servingHint,
    budget: t.budgetHint, results: t.resultsHint };
  const step = state.beforeEdit ? 0 : ["taste", "food", "serving", "budget"].indexOf(screen) + 1;
  const progress = step > 0
    ? `<div class="progress-row" role="progressbar" aria-label="${t.question}" aria-valuemin="1" aria-valuemax="4" aria-valuenow="${step}">
        <span>${step} ${t.of} 4</span><div class="progress-dots" aria-hidden="true">${[1, 2, 3, 4]
          .map((number) => `<span class="${number <= step ? "complete" : ""}"></span>`).join("")}</div></div>`
    : restaurantLine(t, "mb-7");
  let content = "";
  if (screen === "language") {
    content = `<div class="choice-list mt-8">${["en", "de"].map((language) =>
      choice(language === "en" ? t.english : t.german, "", a.language === language ? "check" : "wine",
        "choose-language", language, a.language === language)).join("")}</div>`;
  } else if (screen === "taste") {
    content = `<div class="colour-picker"><p>${t.colourLabel} <span>(${t.optional})</span></p>
      <div class="colour-chips">${button(t.noPreference, "colour", "", "chip-button", { pressed: !a.colourPref })}
      ${COLOURS.map((colour) => button(`<span class="colour-dot colour-${colour}"></span>${t.colours[colour]}`,
        "colour", colour, "chip-button", { pressed: a.colourPref === colour })).join("")}</div></div>
      <div class="choice-list">${TASTES.map((taste, index) => choice(t.tastes[taste][0], t.tastes[taste][1],
        TASTE_ICONS[index], "taste", taste, a.taste === taste)).join("")}</div>
      ${state.beforeEdit && a.taste ? `<div class="bottom-actions">${button(t.saveChanges, "save-taste", "", "sommelier-button")}</div>` : ""}`;
  } else if (screen === "food") {
    content = `<div class="food-options">${FOODS.map((food) => button(
      `${a.foods.includes(food) ? icon("check") : ""}${t.foods[food]}`, "food", food, "chip-button",
      { pressed: a.foods.includes(food) })).join("")}</div>
      <p class="food-hint" role="status">${showFoodLimit ? t.maxFood : ""}</p>
      <div class="bottom-actions">${button(`${t.continue}${icon("arrow-right")}`, "continue", "", "sommelier-button", { disabled: !a.foods.length })}
      ${button(t.skip, "skip-food")}</div>`;
  } else if (screen === "serving") {
    content = `<div class="choice-list serving-options">${["glass", "bottle"].map((serving) =>
      choice(t[serving], serving === "glass" ? t.glassSize : t.bottleSize, "wine", "serving", serving,
        a.serving === serving)).join("")}</div>`;
  } else if (screen === "budget") {
    content = `<div class="choice-list">${BUDGETS.map((budget) => choice(t.budgets[a.serving || "glass"][budget],
      "", budget === "any" ? "sparkles" : "circle-dollar-sign", "budget", budget, a.budget === budget)).join("")}</div>`;
  } else if (screen === "results") {
    content = resultContent(t);
  }
  return `<main class="${screen === "results" ? "results-screen" : "question-screen"} screen-enter">
    ${progress}<h1 id="screen-title" tabindex="-1">${titles[screen]}</h1>
    ${screen === "language" ? "" : `<p class="screen-hint">${hints[screen]}</p>`}${content}</main>`;
}

function wineCard(recommendation, t) {
  const a = state.answers;
  const wine = recommendation.wine;
  const amount = winePrice(wine, a);
  const price = formatPrice(amount, a.language);
  const overage = recommendation.priceNote
    ? formatPrice(amount - BUDGET_LIMITS[a.serving === "glass" ? "glass" : "bottle"][a.budget], a.language)
    : null;
  const sentences = [];
  const taste = recommendation.reasons.find((reason) => reason in t.tasteReasons);
  if (taste) sentences.push(t.tasteReasons[taste]);
  const [food1, food2] = a.foods.filter((food) => wine.foodPairings.includes(food));
  if (food1 && !food2) sentences.push(interpolate(t.foodOne, { food: t.foodForms[food1] }));
  if (food1 && food2) sentences.push(interpolate(t.foodTwo, { food1: t.foodForms[food1], food2: t.foodForms[food2] }));
  sentences.push(interpolate(recommendation.priceNote ? t[recommendation.priceNote]
    : a.serving === "glass" ? t.priceGlass : t.priceBottle, { price }));
  const isBest = recommendation.rank === "best";
  return `<article class="wine-card ${isBest ? "wine-card-best" : ""}">
    <div class="flex items-center justify-between gap-2">${isBest
      ? `<span class="best-badge">${icon("sparkles", "", 14)}${t.best}</span>` : icon("wine", "text-primary", 20)}
      <span class="demo-tag">${t.demo}</span></div>
    <h2>${escapeHTML(wine.name)}</h2><p class="producer">${escapeHTML(wine.producer)}</p>
    <p class="region">${escapeHTML(wine.region)}, ${escapeHTML(wine.country)}</p>
    <div class="wine-style"><span class="colour-dot colour-${wine.colour}"></span>${t.colours[wine.colour]}
      <span>·</span>${t.sweetness[wine.sweetness]}<span>·</span>${wine.body <= 2 ? t.bodies.light : wine.body === 3 ? t.bodies.medium : t.bodies.full}</div>
    <p class="wine-price">${price}<span>${a.serving === "glass" ? t.perGlass : t.perBottle}</span>${wine.glassPrice === null ? `<small>(${t.bottleOnly})</small>` : ""}${overage
      ? `<span class="budget-badge">${escapeHTML(interpolate(t.overBudgetAmount, { amount: overage }))}</span>` : ""}</p>
    <div class="wine-explanation"><h3>${t.why}</h3><p>${escapeHTML(sentences.slice(0, 3).join(" "))}</p></div>
    <div class="flavour-notes">${wine.flavourNotes[a.language].map((note) => `<span>${escapeHTML(note)}</span>`).join("")}</div>
    </article>`;
}

function resultContent(t) {
  const a = state.answers;
  const recommendations = recommendWines(a, WINES);
  const serving = a.serving || "glass";
  const answerButton = (content, target, title) => button(content, "edit", target, "chip-button", { label: `${t.edit}: ${title}` });
  const chips = `<div class="answer-chips">
    ${answerButton(`${icon("grape")}${a.taste ? t.tastes[a.taste][0] : t.tasteTitle}`, "taste", t.tasteTitle)}
    ${a.colourPref ? button(t.colours[a.colourPref], "edit", "taste", "chip-button") : ""}
    ${answerButton(`${icon("utensils")}${a.foods.length ? a.foods.map((food) => t.foods[food]).join(", ") : t.noFood}`, "food", t.foodTitle)}
    ${answerButton(`${icon("wine")}${t[serving]}`, "serving", t.servingTitle)}
    ${answerButton(t.budgets[serving][a.budget || "any"], "budget", t.budgetTitle)}</div>`;
  const fallback = recommendations.meta.noExactMatch
    ? `<p class="fallback-note">${recommendations.meta.budgetOnly ? t.budgetFallback : t.fallback}</p>` : "";
  return `${chips}${fallback}${recommendations.results.length
    ? recommendations.results.map((recommendation, index) => `${index === 1 ? `<h2 class="alternatives-title">${t.alternatives}</h2>` : ""}${wineCard(recommendation, t)}`).join("")
    : `<p role="alert">${t.empty}</p>`}
    <p class="small-text text-center">${t.suggestions}</p>${feedbackContent(recommendations.results.map((item) => item.wine.id), t)}
    ${button(t.startOver, "reset", "", "outline w-full")}`;
}

function feedbackContent(ids, t) {
  const key = JSON.stringify({ ...state.answers, language: undefined, ids });
  if (feedback?.key !== key) {
    let id = typeof crypto.randomUUID === "function" ? crypto.randomUUID() : `demo-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    try {
      const stored = sessionStorage.getItem(`ai-sommelier-result:${key}`);
      if (stored) id = stored;
      else sessionStorage.setItem(`ai-sommelier-result:${key}`, id);
    } catch { /* Keep the in-memory id when storage is denied. */ }
    feedback = { key, id, ids, rating: null, comment: "", sent: readFeedback().some((item) => item.id === id), error: false };
  }
  return `<section class="feedback"><h2>${feedback.sent ? t.thanks : t.helpful}</h2>
    ${feedback.sent ? "" : `<div class="flex justify-center gap-3">${["up", "down"].map((rating) => button(
      icon(`thumbs-${rating}`), "rating", rating, "chip-button", { pressed: feedback.rating === rating, label: t[rating] })).join("")}</div>
      ${feedback.rating ? `<form class="feedback-form" id="feedback-form"><label for="feedback-comment">${t.comment}</label>
        <input id="feedback-comment" name="comment" value="${escapeHTML(feedback.comment)}" maxlength="200">
        <button type="submit" class="sommelier-button">${t.send}${icon("arrow-right")}</button></form>` : ""}`}
    <p class="small-text">${t.anonymous}</p>${feedback.error ? `<p role="alert">${t.storageError}</p>` : ""}</section>`;
}

function render(focusHeading = false) {
  const t = I18N[state.answers.language];
  const focusKey = document.activeElement?.dataset?.focus;
  const header = state.screen === "welcome"
    ? `<div class="brand-lockup">${icon("wine")}<div><strong>${t.brand}</strong><small>${t.team}</small></div></div>`
    : button(icon("arrow-left"), "back", "", "ghost", { label: state.beforeEdit ? t.cancelEdit : t.back });
  root.innerHTML = `<div class="app-shell"><header class="app-header">${header}
    <div class="language-toggle" role="group" aria-label="${t.language}">
      ${button("EN", "language", "en", "ghost", { pressed: state.answers.language === "en", label: t.english })}
      <span aria-hidden="true">/</span>${button("DE", "language", "de", "ghost", { pressed: state.answers.language === "de", label: t.german })}
    </div></header>${state.screen === "welcome" ? welcome(t) : questionnaire(t)}
    <footer class="app-footer"><p>${t.disclaimer}</p><div class="footer-links">
      ${button(t.privacy, "legal", "privacy")}<span aria-hidden="true">·</span>${button(t.imprint, "legal", "imprint")}</div>
      ${new URLSearchParams(location.search).get("debug") === "1" ? button(t.export, "export", "", "text-link") : ""}</footer>
    <span class="sr-only" aria-live="polite">${state.screen === "welcome" ? t.brand : ""}</span>
    ${legalModal ? `<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="legal-title">
      <h2 id="legal-title">${t[legalModal]}</h2><p>${t.placeholder}</p>${button(t.close, "close-modal", "", "sommelier-button")}</div></div>` : ""}</div>`;
  if (legalModal) {
    root.querySelector(".modal button").focus();
  } else if (focusHeading) {
    root.querySelector("#screen-title")?.focus();
    window.scrollTo({ top: 0, behavior: "instant" });
  } else if (focusKey) {
    Array.from(root.querySelectorAll("[data-focus]")).find((element) => element.dataset.focus === focusKey)?.focus();
  }
}

root.addEventListener("click", (event) => {
  const control = event.target.closest("[data-action]");
  if (!control || control.disabled) return;
  const action = control.dataset.action;
  const value = control.dataset.value;
  const a = state.answers;
  switch (action) {
    case "start": updateAnswers({}, "language", true); break;
    case "language": updateAnswers({ language: value }); break;
    case "choose-language": updateAnswers({ language: value }, "taste", true); break;
    case "colour": updateAnswers({ colourPref: value || null }); break;
    case "taste": updateAnswers({ taste: value }, state.beforeEdit ? "results" : "food", true); break;
    case "save-taste": updateAnswers({}, "results", true); break;
    case "food": {
      const selected = a.foods.includes(value);
      if (!selected && a.foods.length >= 2) {
        showFoodLimit = true;
        render();
      } else {
        showFoodLimit = false;
        updateAnswers({ foods: selected ? a.foods.filter((item) => item !== value) : [...a.foods, value] });
      }
      break;
    }
    case "continue": updateAnswers({}, state.beforeEdit ? "results" : "serving", true); break;
    case "skip-food": updateAnswers({ foods: [] }, state.beforeEdit ? "results" : "serving", true); break;
    case "serving": {
      const changed = a.serving && a.serving !== value;
      const next = state.beforeEdit && !changed ? "results" : "budget";
      updateAnswers({ serving: value, ...(changed ? { budget: undefined } : {}) }, next, true);
      break;
    }
    case "budget": updateAnswers({ budget: value }, "results", true); break;
    case "edit":
      lastAdvance = 0;
      updateAnswers({}, value, false, a);
      break;
    case "back":
      lastAdvance = 0;
      if (state.beforeEdit) {
        updateAnswers({ ...state.beforeEdit, language: a.language }, "results");
      } else {
        updateAnswers({}, SCREENS[Math.max(0, SCREENS.indexOf(state.screen) - 1)]);
      }
      break;
    case "reset":
      try {
        sessionStorage.removeItem(SESSION_KEY);
        Object.keys(sessionStorage).filter((key) => key.startsWith("ai-sommelier-result:"))
          .forEach((key) => sessionStorage.removeItem(key));
      } catch { /* Optional. */ }
      state = freshSession(a.language);
      feedback = null;
      lastAdvance = 0;
      saveSession();
      render(true);
      break;
    case "legal":
      modalTrigger = control.dataset.focus;
      legalModal = value;
      render();
      break;
    case "close-modal":
      if (control.classList.contains("modal-backdrop") && event.target !== control) return;
      closeModal();
      break;
    case "rating": feedback.rating = value; render(); break;
    case "export": exportFeedback(); break;
  }
});

root.addEventListener("input", (event) => {
  if (event.target.id === "feedback-comment" && feedback) feedback.comment = event.target.value.slice(0, 200);
});

root.addEventListener("submit", (event) => {
  if (event.target.id !== "feedback-form") return;
  event.preventDefault();
  if (!feedback?.rating || feedback.sent) return;
  try {
    const saved = readFeedback();
    if (!saved.some((item) => item.id === feedback.id)) {
      saved.push({ id: feedback.id, timestamp: new Date().toISOString(), restaurantId: "demo",
        language: state.answers.language, answers: state.answers, recommendedIds: feedback.ids,
        rating: feedback.rating, comment: feedback.comment.slice(0, 200) });
      localStorage.setItem(FEEDBACK_KEY, JSON.stringify(saved));
    }
    feedback.sent = true;
    feedback.error = false;
  } catch { feedback.error = true; }
  render();
});

function closeModal() {
  legalModal = null;
  render();
  Array.from(root.querySelectorAll("[data-focus]")).find((element) => element.dataset.focus === modalTrigger)?.focus();
}

document.addEventListener("keydown", (event) => {
  if (!legalModal) return;
  if (event.key === "Escape") closeModal();
  if (event.key === "Tab") {
    event.preventDefault();
    root.querySelector(".modal button")?.focus();
  }
});

function exportFeedback() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(readFeedback(), null, 2)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "ai-sommelier-feedback.json";
  link.click();
  URL.revokeObjectURL(url);
}

saveSession();
render();

    </script>
  </body>
</html>
